<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generated wallpaper animation</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b1226}
canvas{width:100%;height:100%;display:block}
.label{position:absolute;left:6vw;bottom:7vh;color:#e5efff;font:500 24px system-ui}
.label small{display:block;font-size:13px;opacity:.6;margin-top:8px}
</style>
<canvas id="surface"></canvas>
<div class="label">A quiet orbit<small>Generated web wallpaper · native WebKit host</small></div>
<script>
'use strict';
const canvas=document.getElementById('surface'), context=canvas.getContext('2d');
let accent=[0.2,0.7,0.9], paused=false, elapsed=0, previous;
window.wallpaperPropertyListener={
  applyUserProperties(properties){
    if(properties.accent){const next=properties.accent.value.split(' ').map(Number);
      if(next.length===3&&next.every(Number.isFinite))accent=next;}
  },
  setPaused(value){paused=Boolean(value);}
};
function frame(time){
  if(previous!==undefined&&!paused)elapsed+=Math.min((time-previous)/1000,0.1);
  previous=time;
  const ratio=devicePixelRatio||1, width=innerWidth, height=innerHeight;
  if(canvas.width!==Math.round(width*ratio)||canvas.height!==Math.round(height*ratio)){
    canvas.width=Math.round(width*ratio);canvas.height=Math.round(height*ratio);}
  context.setTransform(ratio,0,0,ratio,0,0);context.fillStyle='#0b1226';context.fillRect(0,0,width,height);
  for(let i=0;i<7;i++){
    const angle=elapsed*(0.08+i*0.013)+i*0.9;
    const x=width*(0.58+Math.cos(angle)*0.22),y=height*(0.48+Math.sin(angle*.9)*0.25);
    const radius=Math.max(width,height)*(0.11+i*0.012);
    const glow=context.createRadialGradient(x,y,0,x,y,radius);
    glow.addColorStop(0,`rgba(${accent.map(v=>Math.round(v*255)).join(',')},.14)`);
    glow.addColorStop(1,'rgba(0,0,0,0)');context.fillStyle=glow;
    context.beginPath();context.arc(x,y,radius,0,Math.PI*2);context.fill();
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
